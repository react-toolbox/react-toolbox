name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      TOOLBOX_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter react-toolbox exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm test:browser
      - run: pnpm test:registry:install
        if: matrix.browser == 'chromium'
      - uses: actions/upload-artifact@v7
        if: matrix.browser == 'chromium'
        with:
          name: source-registry
          path: packages/react-toolbox/registry/public/
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results-${{ matrix.browser }}
          path: test-results/
